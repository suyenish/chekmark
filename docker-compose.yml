# Local services for development. Start with: docker compose up -d
# Redis, the API, the worker and the web app are added in later tasks.
services:
  postgres:
    image: postgres:18-alpine # same major version as the test database
    environment:
      POSTGRES_USER: chekmark
      POSTGRES_PASSWORD: chekmark # local development only
      POSTGRES_DB: chekmark
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chekmark -d chekmark"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
