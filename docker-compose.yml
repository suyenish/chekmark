# Local services for development. Start with: docker compose up -d
# The API, the worker and the web app are added in a later task.
services:
  postgres:
    image: postgres:18-alpine # same major version as the test database
    environment:
      POSTGRES_USER: chekmark
      POSTGRES_PASSWORD: chekmark # local development only
      POSTGRES_DB: chekmark
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chekmark -d chekmark"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for page photos. The API creates the bucket on start in development.
  # SeaweedFS, because MinIO no longer publishes Docker images.
  photos:
    image: chrislusf/seaweedfs:4.50 # same version as the test storage
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
    ports:
      - "8333:8333"
    volumes:
      - photos-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Job queue. Append-only persistence keeps waiting jobs across restarts.
  # noeviction, because BullMQ must never have its keys removed to free memory.
  redis:
    image: redis:8-alpine # same image as the test Redis
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  photos-data:
